<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Small LLM</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div id="log"></div>
  <div id="status">Loading…</div>
  <form id="form">
    <!-- <input type="text" id="prompt" placeholder="Say something" autocomplete="off" disabled> -->
    <textarea id="prompt" rows="1" placeholder="Say something" autocomplete="off" disabled></textarea>
    <button id="send" disabled>Send</button>
    <button id="stop" type="button" hidden>Stop</button>
    <button id="reset" type="button">New chat</button>
  </form>
  <details><summary>Sampling</summary>
    <label>temperature <input type="number" id="temperature" value="0.65" step="0.05" min="0"></label>
    <label>top-p <input type="number" id="topP" value="0.9" step="0.05" min="0.05" max="1"></label>
    <label>repetition penalty <input type="number" id="penalty" value="1.25" step="0.05" min="1"></label>
    <label>max new tokens <input type="number" id="maxNew" value="500" step="50" min="10"></label>
  </details>
</main>

<script type="module" src="script.js"></script>
</body>
</html>
